name: AppNexora Java CI

# Run CI whenever code is pushed
# or when a Pull Request is created/updated.
on:
  push:
    branches:
      - master
      - Admin
      - Admin2
      - employee
      - vv12

  pull_request:
    branches:
      - master

# Prevent multiple CI runs for the same branch/PR.
# If a new commit is pushed, the old CI run will be cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # =========================================================
  # 1. COMPILE CHECK
  # =========================================================
  compile:
    name: Compile Java Project
    runs-on: ubuntu-latest

    steps:

      # Download repository code
      - name: Checkout repository
        uses: actions/checkout@v7

      # Configure the same Java version used by pom.xml
      - name: Set up Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # Print versions to make debugging easier
      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      # Clean old build files and compile source code
      - name: Compile project
        run: mvn --batch-mode --no-transfer-progress clean compile


  # =========================================================
  # 2. UNIT TESTS
  # =========================================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: compile

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # Maven automatically looks inside:
      #
      # src/test/java
      #
      # When JUnit tests are added later, they will run here.
      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test


  # =========================================================
  # 3. PACKAGE / BUILD VALIDATION
  # =========================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # Verify performs compilation, tests and Maven validation.
      - name: Verify Maven project
        run: mvn --batch-mode --no-transfer-progress verify

      # Show generated files
      - name: Show build output
        if: success()
        run: |
          echo "================================"
          echo "AppNexora CI PASSED"
          echo "================================"

          if [ -d "target" ]; then
            echo "Generated target files:"
            ls -lah target/
          else
            echo "No target directory generated."
          fi


  # =========================================================
  # 4. FINAL CI STATUS
  # =========================================================
  ci-success:
    name: AppNexora CI Passed
    runs-on: ubuntu-latest
    needs:
      - compile
      - test
      - build

    steps:

      - name: CI Success
        run: |
          echo "=========================================="
          echo "✅ APPNEXORA CONTINUOUS INTEGRATION PASSED"
          echo "=========================================="
          echo ""
          echo "✓ Java compilation passed"
          echo "✓ Unit tests passed"
          echo "✓ Maven build passed"
          echo ""
          echo "The code is safe to merge."
